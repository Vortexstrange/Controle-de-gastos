<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Gastos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <header>
        <h1>Controle de Gastos</h1>

        <p>
            Registre suas despesas e acompanhe para onde o dinheiro está indo.
        </p>
    </header>


    <section class="card total-card">

        <span>Total exibido</span>

        <strong id="total">R$ 0,00</strong>

    </section>


    <section class="card">

        <h2>Novo gasto</h2>

        <form id="form-gasto" novalidate>

            <label for="descricao">
                Descrição
            </label>

            <input
                    type="text"
                    id="descricao"
                    maxlength="60"
                    placeholder="Ex.: Almoço"
                    required
            >


            <div class="linha">

                <div>

                    <label for="valor">
                        Valor (R$)
                    </label>

                    <input
                            type="number"
                            id="valor"
                            min="0.01"
                            step="0.01"
                            placeholder="0,00"
                            required
                    >

                </div>


                <div>

                    <label for="data">
                        Data
                    </label>

                    <input
                            type="date"
                            id="data"
                            required
                    >

                </div>

            </div>


            <label for="categoria">
                Categoria
            </label>

            <select id="categoria"></select>


            <p
                    id="erro"
                    class="erro"
                    role="alert"
            ></p>


            <button
                    type="submit"
                    class="btn-principal"
            >
                Adicionar gasto
            </button>

        </form>

    </section>


    <section class="card">

        <div class="cabecalho-lista">

            <h2>Gastos</h2>

            <select
                    id="filtro"
                    aria-label="Filtrar por categoria"
            >
                <option value="todas">
                    Todas as categorias
                </option>
            </select>

        </div>


        <p
                id="vazio"
                class="vazio"
        >
            Nenhum gasto encontrado.
        </p>


        <ul
                id="lista-gastos"
                class="lista"
        ></ul>

    </section>


    <section class="card">

        <h2>Resumo por categoria</h2>

        <ul
                id="resumo"
                class="resumo"
        ></ul>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
